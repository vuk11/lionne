name: Lionne tracker

on:
  workflow_dispatch:           # dugme "Run workflow"; svako pokretanje samo zakazuje sledeće (lanac)
  push:
    paths: [".github/workflows/lionne.yml"]   # posle izmene ovog fajla odmah krene
  schedule:
    - cron: "*/15 * * * *"    # rezerva: ako se lanac ikad prekine, GitHub ga ponovo pokrene

permissions:
  contents: write
  actions: write

concurrency:
  group: lionne-tracker
  cancel-in-progress: false    # novo pokretanje čeka da se prethodno završi, pa nastavlja

jobs:
  proveri:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Zakaži sledeće pokretanje (čeka dok se ovo ne završi)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run lionne.yml --repo "${{ github.repository }}" --ref main || echo "Nije uspelo zakazivanje, rezerva je raspored"

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaliraj biblioteku
        run: pip install python-a2s

      - name: Prati server
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVER_IP: "5.181.187.33"
          SERVER_PORT: "27018"
          IGRACI: "1 Lionne"          # više igrača odvojiti zarezom: "1 Lionne, Neko Drugi"
          INTERVAL: "30"              # sekundi između provera
          TRAJANJE: "330"             # koliko minuta jedno pokretanje prati server (~5.5h)
        run: |
          python - <<'KRAJ'
          import os, json, time, subprocess, urllib.request, urllib.parse
          from datetime import datetime, timezone, timedelta
          import a2s

          SERVER = (os.environ["SERVER_IP"], int(os.environ["SERVER_PORT"]))
          IGRACI = [i.strip() for i in os.environ["IGRACI"].split(",") if i.strip()]
          TOKEN = os.environ.get("TELEGRAM_TOKEN")
          CHAT = os.environ.get("TELEGRAM_CHAT_ID")
          INTERVAL = int(os.environ["INTERVAL"])
          KRAJ_RADA = time.time() + int(os.environ["TRAJANJE"]) * 60
          STANJE = "stanje.json"
          BG = timezone(timedelta(hours=2))

          if not (TOKEN and CHAT):
              print("Tajne TELEGRAM_TOKEN / TELEGRAM_CHAT_ID još nisu dodate, preskačem.")
              raise SystemExit(0)

          def norm(s):
              return " ".join(s.split()).lower()

          def sat():
              return datetime.now(BG).strftime("%H:%M")

          def trajanje(sek):
              m = int(sek) // 60
              return f"{m // 60}h {m % 60}min" if m >= 60 else f"{m} min"

          def posalji(tekst):
              print(sat(), "PORUKA:", tekst, flush=True)
              try:
                  data = urllib.parse.urlencode({"chat_id": CHAT, "text": tekst}).encode()
                  urllib.request.urlopen(f"https://api.telegram.org/bot{TOKEN}/sendMessage", data=data, timeout=15)
              except Exception as e:
                  print("Telegram greška:", e, flush=True)

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True)

          def sacuvaj(stanje):
              json.dump(stanje, open(STANJE, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
              git("config", "user.name", "lionne-tracker")
              git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
              git("add", STANJE)
              git("commit", "-m", "Promena statusa")
              for _ in range(3):
                  if git("push").returncode == 0:
                      return
                  git("pull", "--rebase", "-X", "ours")
              print("Upozorenje: stanje nije sačuvano na GitHub", flush=True)

          def igraci_na_serveru():
              poslednja = None
              for _ in range(3):
                  try:
                      try:
                          lista = a2s.players(SERVER, timeout=5, encoding="utf-8")
                          return {norm(p.name): p for p in lista if p.name}
                      except UnicodeDecodeError:
                          lista = a2s.players(SERVER, timeout=5, encoding=None)
                          return {norm(p.name.decode("utf-8", "replace")): p for p in lista if p.name}
                  except Exception as e:
                      poslednja = e
                      time.sleep(3)
              raise poslednja

          prvi_put = not os.path.exists(STANJE)
          stanje = {"online": {}} if prvi_put else json.load(open(STANJE, encoding="utf-8"))

          def beleska(naslov, tekst):
              # vidljivo u Actions i preko API-ja (annotations), za dijagnostiku
              tekst = tekst.replace("%", "%25").replace("\r", " ").replace("\n", " | ")
              print(f"::notice title={naslov}::{tekst}", flush=True)

          poslednja_beleska = 0
          greske_zaredom = 0
          while True:
              try:
                  na_serveru = igraci_na_serveru()
                  greske_zaredom = 0
                  print(sat(), f"na serveru {len(na_serveru)}:", ", ".join(sorted(na_serveru)) or "niko", flush=True)
                  if time.time() - poslednja_beleska > 3600:
                      poslednja_beleska = time.time()
                      beleska(f"{sat()} na serveru {len(na_serveru)}", ", ".join(repr(n) for n in sorted(na_serveru)) or "niko")
                  promena = False
                  sada = time.time()
                  for ime in IGRACI:
                      k = norm(ime)
                      nadjen = next((n for n in na_serveru if k in n), None)
                      if nadjen and k not in stanje["online"]:
                          stanje["online"][k] = sada
                          promena = True
                          if not prvi_put:
                              posalji(f"🟢 {ime} je UŠAO na server ({sat()})")
                      elif not nadjen and k in stanje["online"]:
                          poceo = stanje["online"].pop(k)
                          promena = True
                          posalji(f"🔴 {ime} je IZAŠAO sa servera ({sat()}), igrao ~{trajanje(sada - poceo)}")
                  if prvi_put:
                      status = "\n".join(
                          f"{'🟢 online' if any(norm(i) in n for n in na_serveru) else '⚪ offline'}: {i}" for i in IGRACI
                      )
                      posalji(f"✅ Praćenje radi! Server odgovara, na njemu je {len(na_serveru)} igrača.\n{status}")
                      prvi_put = False
                      promena = True
                  if promena:
                      sacuvaj(stanje)
              except Exception as e:
                  greske_zaredom += 1
                  print(sat(), "Server ne odgovara, preskačem ovu proveru:", repr(e), flush=True)
                  if greske_zaredom in (1, 10, 60, 240):
                      beleska(f"{sat()} server ne odgovara ({greske_zaredom}x zaredom)", repr(e))

              if time.time() + INTERVAL > KRAJ_RADA:
                  break
              time.sleep(INTERVAL)
          KRAJ
